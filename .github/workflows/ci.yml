name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 0 * * 1"

jobs:
  # Gate: skip all CI jobs when release-please merges (already tested in PR)
  should-run:
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, 'release-please--branches--main') && !startsWith(github.event.head_commit.message, 'chore(main): release')) }}"
    steps:
      - run: echo "CI should run"

  test:
    needs: should-run
    timeout-minutes: 15
    name: Node v${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `22.x`, not the `engines.node` floor. This job runs the repository's own
        # toolchain, and every gate is a `node scripts/*.ts` — which needs Node's type
        # stripping, unflagged only from 22.18 (22.17.1 still throws
        # ERR_UNKNOWN_FILE_EXTENSION). Pinning the consumer floor here made the whole
        # matrix fail for a reason that has nothing to do with the package. The floor is
        # a promise about the *published artifact*, so it is checked where that can be
        # checked: `pnpm verify:install`, against a real install of the tarball.
        #
        # Odd-numbered lines are deliberately absent. Node 25 never becomes LTS — it is a
        # six-month staging line for what lands in 26 — so 24 (LTS) and 26 bracket it, and
        # a failure unique to 25 would be a failure in a runtime no consumer is asked to
        # use. Three versions across three operating systems is nine jobs; four was twelve.
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
        if: runner.os == 'Windows'

      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test
        env:
          CI: true

  timezone:
    # **The whole suite outside UTC.**
    #
    # Every runner in the `test` matrix is UTC, and that was load-bearing in the
    # worst way: a spreadsheet date is a calendar value while a JavaScript `Date`
    # is an instant, and the two agree *exactly* at offset zero. So a whole class
    # of defect — `new Date(2024, 0, 15)` storing a different serial in every
    # timezone, a strict-format `t="d"` cell parsed as local time, a display
    # string read with `getHours()` instead of `getUTCHours()` — was structurally
    # invisible to twenty thousand passing assertions. The date suites also fed
    # `Date.UTC(...)` inputs, so they could not detect a disagreement about which
    # reading was meant.
    #
    # One zone, not a matrix. `Asia/Shanghai` is +8 with no DST, which is enough
    # to make every such bug fail: the defect is "depends on the offset at all",
    # and any non-zero offset exposes it. Zone-specific behaviour is asserted
    # inside the suites that care, which set `process.env.TZ` themselves and
    # cover +8, -5 and +14.
    #
    # Node tests only. The browser step rebuilds `dist/` and drives Playwright,
    # which doubles the runtime to re-check the same arithmetic in a second host.
    needs: should-run
    timeout-minutes: 20
    name: Node tests in a non-UTC timezone
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run
        env:
          CI: true
          TZ: Asia/Shanghai

  test-bun:
    needs: should-run
    timeout-minutes: 15
    name: Bun v${{ matrix.bun-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        bun-version: [latest]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
        if: runner.os == 'Windows'

      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run tests (Bun)
        run: bun run vitest run
        env:
          CI: true

  examples:
    # Examples are the first thing a consumer copies, so a broken one is a broken
    # public contract. Nothing executed them until this job: the runner carried a
    # hand-written list covering a sixth of the tree, and CI never invoked it. The
    # first full run found five examples that could not resolve their imports, one
    # that hit a real stack-overflow in the PDF exporter, and one that could not
    # run twice. Discovery is automatic, so a new example is covered the moment it
    # lands.
    #
    # One OS: the failures this catches are API and resolution failures, not
    # platform ones, and the job spawns one process per example.
    needs: should-run
    timeout-minutes: 25
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run every example
        run: pnpm verify:examples
        env:
          CI: true

  lint:
    needs: should-run
    timeout-minutes: 10
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build core (ESM + types)
        run: pnpm build:esm

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm type

      # The repository's own gates. They were previously reachable only through
      # `pnpm check` — a command nobody is forced to run — so a violation could
      # reach `main` while every CI job stayed green. `verify:public-types` and
      # `verify:doc-examples` need the declarations built by the step above; the
      # rest are pure source scans.
      - name: Run repository gates
        run: |
          pnpm verify:layers
          pnpm verify:public-types
          pnpm verify:types-versions
          pnpm verify:doc-examples
          pnpm verify:doc-links

  consumer-floor:
    # `engines.node` is a promise about the published artifact, so it is checked against
    # the published artifact — a real `npm install` of the packed tarball in a CommonJS
    # project, on the exact floor version.
    #
    # The `test` matrix cannot do this. It runs the repository's own toolchain, and every
    # gate is a `node scripts/*.ts`, which needs Node's type stripping — unflagged only
    # from 22.18. Pinning the floor there failed the whole matrix on
    # ERR_UNKNOWN_FILE_EXTENSION for a reason that has nothing to do with the package.
    # Hence the split: the toolchain runs on modern Node, the artifact is verified on the
    # floor, and `verify-installed-package.cjs` is plain CommonJS so it can run there.
    #
    # A symlinked `node_modules` would not do either: resolution has to run against the
    # installed manifest — `exports` conditions, the `#platform/*` `imports` map, and the
    # real directory layout.
    needs: should-run
    timeout-minutes: 15
    name: Consumer floor (Node 22.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26 to build
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build and pack
        run: |
          pnpm build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Use Node.js 22.13.0 — the engines.node floor
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Install the tarball into a CommonJS project and require every subpath
        run: |
          node -v
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          # No "type" field: this is a CommonJS project, which is the case under test.
          echo '{"name":"consumer","version":"1.0.0","private":true}' > package.json
          npm install --no-fund --no-audit "$RUNNER_TEMP"/documonster-*.tgz
          node "$GITHUB_WORKSPACE/scripts/verify-installed-package.cjs" .

  packages:
    # Workspace satellite packages (packages/*). Separate from the `lint` job
    # because they consume `documonster` through its published exports map, so
    # they cannot be type-checked until the core's ESM + type output exists —
    # which is exactly the constraint that keeps them honest public-API
    # consumers rather than reaching into src/.
    #
    # Runs the full OS matrix on purpose: `sandbox.ts` is the most
    # platform-sensitive code in the repo (path separators, drive letters,
    # realpath and symlink semantics all differ on Windows) and it is also the
    # security boundary, so "passes on Linux" is not good enough.
    needs: should-run
    timeout-minutes: 20
    name: Packages on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
        if: runner.os == 'Windows'

      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Verify packages use the public API only
        run: pnpm verify:packages

      - name: Build core (ESM + types)
        run: pnpm build:esm

      - name: Type check packages
        run: pnpm type:packages

      - name: Build packages
        run: pnpm build:packages

      - name: Test packages
        run: pnpm test:packages
        env:
          CI: true

  benchmark:
    needs: should-run
    timeout-minutes: 15
    name: Measure performance impact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run benchmark
        run: pnpm benchmark
        env:
          CI: true

      # The XLSB benchmarks, which CI did not run at all.
      #
      # `benchmark:xlsb` is the format comparison — size, write, read, passthrough, blank-tail heap — and it is the check
      # that caught a 3.34x read regression introduced by the passthrough hash. `benchmark:xlsb-scale` is the ten-million
      # cell streaming shape; it used to live in `examples/` where two correctness gates ran it, producing a 99 MB and a
      # 145 MB workbook every time and then converting both through LibreOffice.
      #
      # Run for their exit status rather than compared against a threshold: what is being protected here is that the
      # commands still work and the shapes are still measurable, which is what silently rotted while nothing invoked them.
      - name: Run XLSB benchmarks
        run: |
          pnpm benchmark:xlsb
          pnpm benchmark:xlsb-scale
        env:
          CI: true

  xlsb-corpus:
    # The XLSB semantic corpus, which nothing in CI ran until this job existed.
    #
    # `verify:xlsb-corpus` is 107 check groups over 23 real-world `.xlsb` files — probes with asserted values, exact
    # passthrough, an edited round trip, cross-container parity and the three formula-read policies. The cross-container
    # group is the one that has found defects nothing else could: XLSB→XLSX was dropping comments 4→1, from two
    # independent causes, and both were invisible to a round trip through this library's own reader.
    #
    # A separate job because the corpus is *downloaded*. Putting it in the nine-cell test matrix would fetch it nine
    # times to learn the same thing, and a network failure would fail every platform at once.
    #
    # `DOCUMONSTER_REQUIRE_XLSB_CORPUS` makes the passthrough suite fail rather than skip when the fixtures are absent.
    # Those tests degrade to no-ops without them — correct for a developer, and indistinguishable from success here.
    needs: should-run
    timeout-minutes: 25
    name: XLSB corpus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Fetch the corpus
        run: pnpm corpus:xlsb

      - name: Semantic checks across the corpus
        run: pnpm verify:xlsb-corpus
        env:
          CI: true

      # **Every corpus-backed suite, not just the passthrough one.**
      #
      # Four test files reach into `tmp/xlsb-corpus/` and each degrades to a no-op without it. The regular `test` job does
      # not download the corpus and this job used to run only one of them, so three suites — the validator's real-world
      # sweep, the corpus comment cases and the pivot-preservation cases — were skipped in every job that existed. A test
      # that never runs anywhere is indistinguishable from one that always passes.
      #
      # `DOCUMONSTER_REQUIRE_XLSB_CORPUS` makes the passthrough suite *fail* rather than skip when a fixture is absent,
      # which is what turns "the download worked" into an assertion instead of an assumption.
      - name: Corpus-backed suites, with the corpus required present
        run: |
          pnpm exec vitest run \
            src/modules/excel/xlsb/__tests__/passthrough.node.test.ts \
            src/modules/excel/xlsb/__tests__/comments.node.test.ts \
            src/modules/excel/xlsb/__tests__/pivot-preservation.node.test.ts \
            src/modules/excel/utils/__tests__/xlsb-validator/real-world-corpus.node.test.ts
        env:
          CI: true
          DOCUMONSTER_REQUIRE_XLSB_CORPUS: "1"

  chart-oracle:
    # Opt-in real-file validation: install LibreOffice on Linux and run
    # the `chart-oracle.integration.node.test.ts` suite with the env flags
    # that enable real binary round-trips. The test file skips every
    # `it` when the flags are unset, so the rest of the matrix (which
    # doesn't install LibreOffice) keeps working unchanged.
    #
    # We gate on a single Linux runner — LibreOffice is slow to install
    # (~200MB of apt packages) and the goal is catching open-validation
    # regressions, not multiplying across OS/Node variants.
    needs: should-run
    # Raised from 20 for the whole-tree LibreOffice gate added at the end of this job: 149 files, each a separate
    # headless process start, measured at roughly 50 minutes locally.
    timeout-minutes: 90
    name: Chart real-file oracle (LibreOffice)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install LibreOffice (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-calc
          soffice --headless --version

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run chart-oracle tests
        run: pnpm exec vitest run src/modules/excel/chart/__tests__/chart-oracle.integration.node.test.ts src/modules/excel/chart/__tests__/workbook-chart-roundtrip.integration.node.test.ts
        env:
          CI: true
          LIBREOFFICE_BIN: soffice
          DOCUMONSTER_LIBREOFFICE_VISUAL_ORACLE: "1"
          DOCUMONSTER_LIBREOFFICE_OPEN_VALIDATION: "1"
          # Optional enterprise corpus — only fires when the private
          # directory is mounted into the runner (via repository
          # secret + setup action). Safe to leave unset on public PRs.
          DOCUMONSTER_ENTERPRISE_CORPUS_DIR: ${{ vars.DOCUMONSTER_ENTERPRISE_CORPUS_DIR }}
          DOCUMONSTER_CORPUS_LIBREOFFICE_OPEN_VALIDATION: "1"

      # The examples have to run first: this gate reads what they wrote to `tmp/`.
      #
      # It asks the one question no other check here can — whether an *independent* implementation can read what this
      # library writes. The round-trip tests are judged by this library's own reader, which shares its assumptions with
      # the writer; the byte oracle needs a human to save each reference file and so covers fifteen cases; and most of
      # the files this repository produces have never been opened by anyone. LibreOffice is the only judge that is both
      # independent and cheap enough to point at all 149 of them.
      #
      # `--require` is deliberate. Without it the script skips when LibreOffice is absent, which is right for a
      # developer machine and useless here: a skip and a pass are indistinguishable, so a broken apt install would
      # leave this job green forever. That is not hypothetical — the repository's *existing* LibreOffice tests looked
      # for `soffice` on PATH only, a cask installs it outside PATH on macOS, and they had therefore been silently
      # skipping since they were written.
      #
      # A failure here means the file is structurally broken. A pass does not mean Excel accepts it: LibreOffice is
      # markedly more permissive, and an array formula missing a per-cell `PtgExp` once terminated Excel's own process
      # while every automated check in this repository passed.
      - name: Write the examples' output
        run: pnpm verify:examples

      - name: LibreOffice reads every .xlsb this library writes
        run: pnpm verify:libreoffice --require
        env:
          SOFFICE: soffice

  codeql:
    needs: should-run
    timeout-minutes: 10
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: +security-and-quality
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
